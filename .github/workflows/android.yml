name: Android build

on:
  push:
    paths:
      - 'shwe-pan-farm.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key (from repository secrets)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK and Play Store bundle
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          grep -n -A12 -E "What went wrong|error:|e: |FAILURE|Could not" "$RUNNER_TEMP/build.log" | head -c 30000 > "$RUNNER_TEMP/err.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/err.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::$msg"

      - name: Test APK (install on a phone to try)
        uses: actions/upload-artifact@v4
        with:
          name: shwe-pan-farm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Play Store bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: shwe-pan-farm-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
