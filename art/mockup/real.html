/* ---------- branch helper: tapered limb with bark ---------- */
function limb(x0,y0,x1,y1,w0,w1,bark){const L=Math.hypot(x1-x0,y1-y0);const nx=-(y1-y0)/L,ny=(x1-x0)/L;

    for(let k=-w/2-0.5;k<=w/2+0.5;k+=.5){const px=cx+nx*k,py=cy+ny*k;const e=Math.abs(k)>w/2-.2;const s=k/(w/2||1);
      P(px,py,e?OUT:s<-.3?bark[2]:s<.35?bark[1]:bark[0])}}}
function barkLines(x,y,w,h,col){for(let i=0;i<h*w/6;i++){const px=x+rnd()*w,py=y+rnd()*h;P(px,py,col);P(px,py+1,col)}}
/* ======================= PADAUK (Pterocarpus macrocarpus) in full bloom ======================= */
function padauk(x,y){SH(x,y+3,40,6,.32);
  const B=['#5a4a3e','#7a6858','#a08a74'];
  // short trunk forking low into 3-4 spreading limbs
  limb(x,y,x,y-18,9,7,B);barkLines(x-3,y-18,6,18,'#4a3c32');
  limb(x-1,y-16,x-22,y-40,6,3,B);limb(x+1,y-16,x+24,y-42,6,3,B);limb(x,y-18,x-4,y-50,5,3,B);limb(x+2,y-30,x+12,y-56,3,2,B);limb(x-14,y-32,x-30,y-44,3,2,B);limb(x+16,y-34,x+32,y-40,3,2,B);
  // crown: many small leaf clusters (pinnate foliage) — back to front
  const pts=[];for(let i=0;i<46;i++){const a=Math.PI+rnd()*Math.PI,d=Math.sqrt(rnd());pts.push([x+Math.cos(a)*36*d,y-46+Math.sin(a)*24*d*.9+ (rnd()-.5)*6,4+rnd()*3])}
  pts.sort((a,b)=>a[1]-b[1]);
  const LF=['#3a5a2a','#4c7a30','#6a9a3a','#8cba48','#b4d868'];
  for(const [px,py,r] of pts){blob([[px,py,r],[px+r*.7,py+1,r*.7],[px-r*.6,py+1,r*.6]],LF,'#22381a')}
  // golden flower sprays: dense clusters covering the crown (that's how padauk looks when it blooms)
  for(const [px,py,r] of pts){const n=5+(rnd()*6|0);for(let k=0;k<n;k++){const fx=px+(rnd()-.5)*r*2,fy=py+(rnd()-.6)*r*1.6;
      P(fx,fy,'#f8d020');P(fx+1,fy,'#ffe85a');P(fx,fy-1,'#ffe85a');if(rnd()<.5)P(fx+1,fy+1,'#e0a010');if(rnd()<.3)P(fx-1,fy,'#fff4a0')}}
  // fallen petals carpet
  for(let i=0;i<70;i++){const a=rnd()*6.28,d=Math.sqrt(rnd());P(x+Math.cos(a)*38*d,y+2+Math.sin(a)*6*d,rnd()<.6?'#f8d020':'#e0a010')}
}

/* ======================= BANYAN (Ficus benghalensis) ======================= */
function banyan(x,y){SH(x,y+4,56,8,.34);
  const B=['#6a5a48','#8a7a64','#b0a088'];
  // prop roots that have become pillar trunks
  for(const [dx,w] of [[-42,3],[-30,4],[-16,3],[22,3],[34,4],[46,3]]){limb(x+dx,y+1,x+dx+(dx<0?2:-2),y-40,w,w-.5,B)}
  // massive fluted main trunk + buttress roots
  poly([[x-12,y+2],[x-9,y-30],[x+9,y-30],[x+13,y+2],[x+20,y+4],[x-20,y+4]],(px,py)=>{const f=((px-x+40)%4);return f===0?'#5a4a3a':px<x-4?'#a8987e':px>x+5?'#6a5a48':(h2(px,py>>1)>.5?'#8a7a64':'#7e6e58')});
  polyOutline([[x-12,y+2],[x-9,y-30],[x+9,y-30],[x+13,y+2],[x+20,y+4],[x-20,y+4]],OUT);
  // big horizontal limbs
  limb(x-6,y-28,x-48,y-42,7,4,B);limb(x+6,y-28,x+50,y-44,7,4,B);limb(x,y-30,x-6,y-52,6,4,B);limb(x+2,y-32,x+20,y-56,4,3,B);
  // hanging aerial roots (thin, many)
  for(let i=0;i<34;i++){const dx=-52+rnd()*104,top=y-40+Math.abs(dx)*.05,len=10+rnd()*26;for(let k=0;k<len;k++){P(x+dx+Math.sin(k*.35+i)*.5,top+k,k%4===0?'#5a4a3a':'#8a7a64')}}
  // broad, flat-domed dark glossy canopy made of many leaf clusters
  const LF=['#1c3a26','#27502e','#346a36','#4a8a3e','#74b050'];
  const pts=[];for(let i=0;i<70;i++){const u=rnd()*2-1,d=rnd();pts.push([x+u*58,y-50-Math.sqrt(1-u*u)*22*d-(rnd()*6),5+rnd()*3.5])}
  pts.sort((a,b)=>a[1]-b[1]);for(const [px,py,r] of pts)blob([[px,py,r],[px+r*.8,py+1,r*.65],[px-r*.7,py+1,r*.6]],LF,'#10261a');
  // glossy highlights + a few red figs
  for(let i=0;i<40;i++){const p=pts[rnd()*pts.length|0];P(p[0]-2+rnd()*3,p[1]-p[2]*.5,'#b8e080')}
  for(let i=0;i<16;i++){const p=pts[rnd()*pts.length|0];P(p[0]+rnd()*4-2,p[1]+rnd()*3,'#c8402c')}
}

/* ======================= TODDY PALM (Borassus flabellifer) ======================= */
function fanLeaf(cx,cy,a,stalk,rad,pal,dead,alt){ // long petiole + fan of stiff pleated segments with split tips
  const ex=cx+Math.cos(a)*stalk,ey=cy+Math.sin(a)*stalk*.8;stem(cx,cy,ex,ey,dead?'#6a5422':'#7a8a3a',dead?'#8a7032':'#a8b858');
  const span=dead?1.0:1.15,segs=11;
  for(let sgi=0;sgi<segs;sgi++){const aa=a-span/2+span*(sgi+.5)/segs;const len=rad-(sgi%2)*1.5-(Math.abs(sgi-segs/2)>4?1:0);
    for(let r=1;r<=len;r++){const px=ex+Math.cos(aa)*r,py=ey+Math.sin(aa)*r*.85+(dead?r*.55:0);
      const tip=r>=len-1;let col=tip?pal[0]:(sgi%2?pal[2]:pal[3]);if(alt&&!tip)col=sgi%2?pal[1]:pal[2];if(r<2)col=pal[1];P(px,py,col)}}
}
function toddy(x,y){SH(x,y+3,12,3,.32);
  // tall straight trunk, slightly swollen, leaf-base scars near the top, dark grey
  for(let k=0;k<92;k++){const w=k<6?7:k>80?6:5;for(let i=0;i<w;i++){const t=i/(w-1);P(x+i-w/2,y-k,i===0||i===w-1?OUT:t<.35?'#6a6460':t<.7?'#4a4442':'#3a3432')}
    if(k%3===0)R(x-w/2+1,y-k,w-2,1,'#2e2a28');if(k>78&&k%4===1){P(x-w/2,y-k,'#6a5a3a');P(x+w/2-1,y-k,'#6a5a3a')}}
  const cx=x,cy=y-96;
  const GL=['#1c3a26','#3a6a32','#5a9a42','#8ac25a'],DL=['#4a3a18','#7a6428','#a08a3a','#c4ae5a'];
  // dead hanging leaves below crown
  for(const a of [2.1,1.0,2.7,0.45])fanLeaf(cx,cy+2,a,10,8,DL,true);
  // fruit clusters (dark purple-black toddy fruits)
  for(const dx of [-5,4]){for(let j=0;j<3;j++)for(let i=0;i<3;i++){const fx=cx+dx+i*2-2,fy=cy+4+j*2;for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]])P(fx+a,fy+b,(a+b)?'#2a1a2a':'#5a3a5a')}}
  // living fans all round: back first, front last
  const ang=[];for(let k=0;k<11;k++)ang.push(-Math.PI/2+(k-5)*.5);
  ang.sort((a,b)=>Math.sin(a)-Math.sin(b));ang.forEach((a,k)=>fanLeaf(cx,cy,a,13+(k%2)*3,11,GL,false,k%2===1));
}

// jasmine: small oval glossy leaves in pairs, white 5-petal star flowers + buds
function jasmine(x,y){SH(x,y+2,16,3,.25);
  for(let i=0;i<9;i++){const a=-1.57+(i-4)*.32,L=14+h2(i,5)*8;stem(x,y,x+Math.cos(a)*L,y+Math.sin(a)*L,'#3a6a2a');for(let k=3;k<L;k+=3){const px=x+Math.cos(a)*k,py=y+Math.sin(a)*k;leaf(px,py,a-1.1,3.4,1.3,G);leaf(px,py,a+1.1,3.4,1.3,G)}}
  for(let i=0;i<16;i++){const a=-1.57+(rnd()-.5)*2.8,d=8+rnd()*12;const fx=x+Math.cos(a)*d,fy=y+Math.sin(a)*d;
    if(i%4===0){P(fx,fy,'#f8f0e0');P(fx,fy+1,'#e8d8c0');continue}

// bougainvillea: woody arching canes, small heart leaves, papery magenta bracts in clusters
function bougain(x,y){SH(x,y+2,20,3,.25);
  for(const [a,L] of [[-2.4,26],[-1.9,30],[-1.3,28],[-0.8,24],[-1.6,20]]){let px=x,py=y;for(let k=0;k<L;k++){const aa=a+k*.02;px+=Math.cos(aa);py+=Math.sin(aa)*.9;P(px,py,'#6a4a32');if(k%4===2){leaf(px,py,aa-1.3,3,1.4,G,{shape:'heart'});leaf(px,py,aa+1.3,3,1.4,G,{shape:'heart'})}}

// marigold: feathery dark leaves, layered orange/yellow pom-pom heads
function marigold(x,y){SH(x,y+2,14,2.5,.25);
  for(let i=0;i<7;i++){const a=-1.57+(i-3)*.28,L=12+h2(i,9)*6;const ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;stem(x,y,ex,ey,'#3a6a2a');for(let k=2;k<L-2;k+=2){const px=x+Math.cos(a)*k,py=y+Math.sin(a)*k;P(px-2,py,'#2f5a2a');P(px+2,py-1,'#2f5a2a');P(px-1,py,'#4a8a3a');P(px+1,py-1,'#4a8a3a')}
    const col=i%2?['#c85a08','#f08a10','#f8b030']:['#d89008','#f8c018','#ffe060'];for(let j=-3;j<=3;j++)for(let ii=-3;ii<=3;ii++){const d=ii*ii+j*j;if(d<=10)P(ex+ii,ey+j,d>7?col[0]:((ii+j)%2?col[1]:col[2]))}P(ex-1,ey-1,'#fff4b0')}}

function lotus(x,y){for(let j=-9;j<=9;j++)for(let i=-24;i<=24;i++){const d=(i/24)**2+(j/9)**2;if(d<=1)P(x+i,y+j,d>.9?'#3a6a8a':(h2(i>>1,j)>.85?'#8ac8e8':'#5aa0c8'))}
  for(const [px,py,r] of [[-12,2,6],[10,4,5],[16,-3,4],[-4,6,4]]){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const d=(i/r)**2+(j/(r*.55))**2;const notch=i>0&&Math.abs(j)<1&&i>r*.2;if(d<=1&&!notch)P(x+px+i,y+py+j*.55,d>.8?'#1f4a2a':(i<0?'#7ab84e':'#5a9a40'))}P(x+px,y+py,'#9ad06a')}
