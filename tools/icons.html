<!doctype html><html><body style="margin:0;background:#222">
<canvas id="a" width="64" height="64"></canvas><canvas id="b" width="64" height="64"></canvas><canvas id="c" width="64" height="64"></canvas>
<script>
function kit(id){const c=document.getElementById(id).getContext('2d');
  const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const D=(cx,cy,r,col)=>{c.fillStyle=col;for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++)if((x+.5-cx)**2+(y+.5-cy)**2<=r*r)c.fillRect(x,y,1,1)};
  const P=(pts,col)=>{c.fillStyle=col;pts.forEach(([x,y])=>c.fillRect(x,y,1,1))};
  const TRI=(x0,y0,x1,y1,x2,y2,col)=>{c.fillStyle=col;for(let y=0;y<64;y++)for(let x=0;x<64;x++){const px=x+.5,py=y+.5;const d=(x1-x0)*(py-y0)-(y1-y0)*(px-x0),e=(x2-x1)*(py-y1)-(y2-y1)*(px-x1),f=(x0-x2)*(py-y2)-(y0-y2)*(px-x2);if((d>=0&&e>=0&&f>=0)||(d<=0&&e<=0&&f<=0))c.fillRect(x,y,1,1)}};
  const bands=(cols)=>{const h=64/cols.length;cols.forEach((col,i)=>R(0,Math.round(i*h),64,Math.ceil(h)+1,col))};
  return {c,R,D,P,TRI,bands}}
/* 1 · golden flower over the field */
{const {R,D,P,bands}=kit('a');
  bands(['#2f6a5a','#357a5e','#3d8a60','#469a62','#52a864','#5eb466','#6cbf6a','#7aca70']);
  // sun halo
  D(32,27,23,'#f6d978');D(32,27,21,'#f9e49a');D(32,27,18,'#fcefc0');
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;for(let r=19;r<23;r++)R(Math.round(32+Math.cos(a)*r),Math.round(27+Math.sin(a)*r),1,1,'#fff6d8')}
  // field rows
  R(0,48,64,16,'#6a4424');for(let y=50;y<64;y+=4)R(0,y,64,2,'#8a5a30');
  for(let x=4;x<64;x+=8)for(let y=49;y<64;y+=4){R(x,y-2,1,2,'#3f8a35');R(x-1,y-2,1,1,'#6cc04a');R(x+1,y-3,1,1,'#6cc04a')}
  // stem + leaves
  R(31,36,2,13,'#2f6a2a');R(33,36,1,13,'#4a9a3a');
  for(const [x,y,s] of [[26,42,-1],[34,39,1]]){for(let i=0;i<6;i++){R(x+s*i,y+Math.abs(i-3)-1,1,2,'#3f8a35');R(x+s*i,y+Math.abs(i-3)-1,1,1,'#6cc04a')}}
  // golden flower: 8 petals
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/2;D(32+Math.cos(a)*8.5,26+Math.sin(a)*8.5,5.2,'#7a4a08')}
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/2;D(32+Math.cos(a)*8.5,26+Math.sin(a)*8.5,4.2,i%2?'#e8a420':'#f2b82a');D(32+Math.cos(a)*7.5-1,26+Math.sin(a)*7.5-1,1.6,'#ffe27a')}
  D(32,26,6,'#7a4a08');D(32,26,5,'#c8701a');D(32,26,3.6,'#e8902a');P([[30,24],[31,24],[30,25]],'#ffd27a');
  // sparkles
  for(const [x,y] of [[12,12],[52,10],[54,38],[9,34]]){R(x,y-2,1,5,'#fffbe8');R(x-2,y,5,1,'#fffbe8');R(x,y,1,1,'#ffffff')}
}
/* 2 · thatched farmhouse at sunrise */
{const {R,D,TRI,bands}=kit('b');
  bands(['#f2a65a','#f4b468','#f6c27a','#f8d08e','#fadca2','#fce6b6']);
  D(46,20,9,'#fff1c4');D(46,20,7,'#fff8de');
  // far hills
  D(10,46,18,'#6aa65a');D(52,48,20,'#5a9a4e');D(32,52,18,'#7ab866');
  // banyan tree
  R(52,26,3,16,'#5a3a20');D(53,22,9,'#2f6a2a');D(49,20,6,'#3f8a35');D(57,19,6,'#3f8a35');D(53,16,6,'#4a9a3a');D(51,17,2,'#6cbf5a');
  // house on stilts
  R(16,40,2,10,'#5a3a20');R(30,40,2,10,'#5a3a20');R(42,40,2,10,'#5a3a20');
  R(14,30,32,11,'#2a1a10');R(15,31,30,9,'#c89060');for(let x=15;x<45;x+=3)R(x,31,1,9,'#a87048');
  R(27,33,6,8,'#2a1a10');R(28,34,4,7,'#7a4a28');R(18,33,5,4,'#2a1a10');R(19,34,3,2,'#ffd27a');R(37,33,5,4,'#2a1a10');R(38,34,3,2,'#ffd27a');
  TRI(10,31,30,14,50,31,'#2a1a10');TRI(12,30,30,16,48,30,'#e0b860');
  for(let i=0;i<14;i++){const y=17+i;R(30-(y-15)*1.05+2,y,1,1,'#c89a40');R(30+(y-15)*1.05-3,y,1,1,'#c89a40')}
  R(12,29,36,2,'#b8883a');
  // stairs
  for(let i=0;i<4;i++)R(26-i*2,41+i*2,8,1,'#7a4a28');
  // field rows + golden flower
  R(0,52,64,12,'#6a4424');for(let y=54;y<64;y+=3)R(0,y,64,1,'#8a5a30');
  for(let x=3;x<64;x+=6){R(x,51,1,3,'#3f8a35');R(x-1,51,1,1,'#7cd05a');R(x+1,50,1,1,'#7cd05a')}
  D(10,48,2.4,'#7a4a08');D(10,48,1.6,'#f2b82a');D(54,50,2.4,'#7a4a08');D(54,50,1.6,'#f2b82a');
}
/* 3 · full-moon night at grandpa's old well */
{const {R,D,P,bands}=kit('c');
  bands(['#141634','#191c40','#1e234c','#252b58','#2c3464','#343d70']);
  D(44,16,10,'#f6e8b8');D(44,16,9,'#fff4d0');D(41,13,2,'#efe0b0');D(47,19,1.5,'#efe0b0');
  // three stars
  for(const [x,y] of [[10,10],[18,6],[25,12]]){R(x,y-2,1,5,'#ffe9a0');R(x-2,y,5,1,'#ffe9a0');R(x,y,1,1,'#ffffff')}
  // sky lanterns
  for(const [x,y] of [[8,26],[56,32],[20,22]]){R(x,y,3,4,'#e8702a');R(x,y,3,1,'#ffb860');R(x+1,y+4,1,1,'#ffd27a')}
  // ground
  D(32,78,40,'#1f3a2a');D(32,80,38,'#264a32');
  // glow from the well
  D(32,40,15,'rgba(255,210,110,.18)');D(32,40,11,'rgba(255,220,130,.22)');
  // well
  R(19,40,26,14,'#1a1410');R(20,41,24,12,'#8a8478');for(let y=41;y<53;y+=3)for(let x=20+((y/3)%2)*3;x<44;x+=6)R(x,y,1,3,'#6a6458');R(20,41,24,1,'#a8a294');
  R(18,38,28,4,'#1a1410');R(19,39,26,2,'#c8c0b0');
  R(22,22,2,17,'#3a2414');R(40,22,2,17,'#3a2414');R(20,20,24,3,'#1a1410');R(21,21,22,1,'#7a4a28');
  R(31,23,1,9,'#c8a870');R(29,32,5,4,'#5a3a20');
  // golden light inside
  R(21,38,22,2,'#ffcf6a');R(24,37,16,1,'#fff0b0');
  for(const [x,y] of [[26,33],[37,30],[33,27],[14,46],[50,44]])R(x,y,1,1,'#ffe58a');
  // stars on slab
  P([[28,47],[32,46],[36,47]],'#ffe9a0');
}
</script></body></html>
