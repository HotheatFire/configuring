<title>Shwe Pan Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=VT323&display=swap">
<style>
:root{
  /* Layout: one-screen game. HUD strip, pixel stage, tool belt, touch pad. Single dark "teak wood" look by choice. */
  --wood:#22190f;
  --wood-2:#352617;
  --plank:#5b4128;
  --paper:#f1e2c2;
  --muted:#c2ab84;
  --leaf:#8fd16a;
  --gold:#f2c14e;
  --sky:#7cc4f0;
  --danger:#ef7a5d;
  --display:'VT323','Padauk',system-ui,sans-serif;
  --body:'Padauk','VT323',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wood);color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}

#hud{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{font-size:19px;background:var(--wood-2);border:1px solid var(--plank);border-radius:6px;padding:2px 8px;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.6}
.chip.gold{color:var(--gold)}
.chip.btn:hover{border-color:var(--gold)}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bar{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--muted)}
.bar i{flex:1;height:10px;background:#120d08;border:1px solid var(--plank);border-radius:3px;overflow:hidden;min-width:40px}
.bar b{display:block;height:100%;background:var(--leaf);transition:width .3s}
.bar b.g{background:var(--gold)}
.bar em{font-style:normal;font-family:var(--display);color:var(--paper);font-size:16px;white-space:nowrap}

#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--plank);border-radius:6px;background:#3a6b2a;touch-action:none;max-width:100%}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,14,8,.88);border:1px solid var(--plank);border-radius:8px;padding:4px 12px;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

#belt{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--wood-2);border:2px solid var(--plank);border-radius:8px;padding:4px 2px;min-width:0}
.slot canvas{width:28px;height:28px;image-rendering:pixelated}
.slot span{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot small{font-family:var(--display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.on{border-color:var(--gold);background:#4a3520}

#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,48px);gap:3px}
.dpad button,.ab button{background:var(--wood-2);border:2px solid var(--plank);border-radius:10px;font-family:var(--display);font-size:18px;touch-action:none}
.dpad button:active,.dpad button.held,.ab button:active{background:var(--plank)}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;line-height:1.1}
.ab button b{font-family:var(--display);font-size:22px}
.ab button small{font-size:11px;color:var(--muted)}
.ab .a{border-color:#7a9a4a}
.ab .b{border-color:#9a6a3a;transform:translateY(-18px)}
#keys{display:none;text-align:center;color:var(--muted);font-size:13px}
@media (hover:hover) and (pointer:fine){#pad{display:none}#keys{display:block}}

#modal{position:fixed;inset:0;background:rgba(10,7,4,.72);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.card{background:var(--wood-2);border:3px solid var(--plank);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:86vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-family:var(--display);font-size:22px;color:var(--gold);text-wrap:balance;line-height:1.5}
.card h2.big{font-size:30px}
.card p{margin:0;line-height:1.8}
.card .sub{color:var(--muted);font-size:13px}
.card ul{margin:0;padding-left:18px;line-height:1.8}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bt{background:var(--plank);border:2px solid #7a5a38;border-radius:8px;padding:6px 14px}
.bt.pri{background:#4d6b2a;border-color:var(--leaf)}
.bt:disabled{opacity:.4;cursor:default}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--plank)}
.item b{font-weight:700}
.item .sub{grid-column:1}
.item .bt{grid-row:1/3;grid-column:2;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){font-family:var(--display);text-align:right}
.hearts{color:var(--danger);letter-spacing:2px;font-size:16px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,44px)}.ab button{width:62px;height:62px}}
@media (prefers-reduced-motion:reduce){#toast,.bar b{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="row"><span class="chip" id="hDay"></span><span class="chip" id="hTime"></span><span class="chip" id="hWx"></span></div>
    <div class="row"><span class="chip gold" id="hMoney"></span><button class="chip btn" id="bBag" type="button">အိတ်</button></div>
    <div class="bars">
      <div class="bar"><span>အားအင်</span><i><b id="eBar"></b></i></div>
      <div class="bar"><span>ရွာကယ်ငွေ</span><i><b id="gBar" class="g"></b></i><em id="gTxt"></em></div>
    </div>
  </header>
  <main id="stage"><canvas id="cv" aria-label="ခြံ မြေပုံ"></canvas><div id="toast" role="status"></div></main>
  <nav id="belt" aria-label="ကိရိယာများ"></nav>
  <section id="pad">
    <div class="dpad">
      <span></span><button type="button" data-d="up" aria-label="အပေါ်">▲</button><span></span>
      <button type="button" data-d="left" aria-label="ဘယ်">◀</button><span></span><button type="button" data-d="right" aria-label="ညာ">▶</button>
      <span></span><button type="button" data-d="down" aria-label="အောက်">▼</button><span></span>
    </div>
    <div class="ab">
      <button type="button" class="a" id="btnA"><span><b>A</b><br><small>သုံးမယ်</small></span></button>
      <button type="button" class="b" id="btnB"><span><b>B</b><br><small>ကိုင်မယ်</small></span></button>
    </div>
  </section>
  <div id="keys">မြှားခလုတ် / WASD လမ်းလျှောက် · Z / Space ကိရိယာသုံး · X / Enter ရိတ်၊ ကောက်၊ ပို့၊ အိပ် · 1–6 ကိရိယာရွေး · R မျိုးစေ့ပြောင်း · အိမ်တံခါးဆီ လျှောက်ရင် အိမ်ထဲဝင်မယ်</div>
  <div id="modal" hidden><div class="card" id="mcard"></div></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const T=16,VW=15,VH=11,MW=30,MH=22,GOAL=10000,DAYS=30,TICK=300,SLEN=10;
const G=0,SOIL=1,WEED=2,ROCK=3,TREE=4,WATER=5,PATH=6,FENCE=7,HOUSE=8,BIN=9,TROUGH=10,STALL=11,FLOWER=12;
const SOLID=new Set([ROCK,TREE,WATER,FENCE,HOUSE,BIN,TROUGH,STALL]);
const SEASONS=[
  {name:'နွေ',rain:.08,grass:'#86a843',gs:['#7c9e3a','#6e8f33','#9cbc55','#b2c866'],path:'#dcb87f',flowers:['#f6c829','#f08a3a','#e2402f','#ffffff']},
  {name:'မိုး',rain:.55,grass:'#4f9e3c',gs:['#47933a','#3d8530','#5fb04a','#74c45a'],path:'#c09a66',flowers:['#ffffff','#b9a3ff','#7fb8ff','#f7a1c4']},
  {name:'ဆောင်း',rain:.05,grass:'#7fa556',gs:['#77994f','#6a8a45','#90b468','#a8c47a'],path:'#d3ae79',flowers:['#f4d35e','#f7a1c4','#ffffff','#e85a8a']},
];
const seasonOf=d=>Math.min(2,Math.floor((d-1)/SLEN));
const curS=()=>seasonOf(S.day);
const CROPS={
  kangkong:{name:'ကန်စွန်း',s:0,grow:3,regrow:0,sell:45,bag:120,col:'#4fb848',col2:'#9fe07a'},
  tomato:{name:'ခရမ်းချဉ်သီး',s:0,grow:6,regrow:3,sell:60,bag:300,col:'#e2402f',col2:'#ff8a6c'},
  melon:{name:'ဖရဲသီး',s:0,grow:8,regrow:0,sell:180,bag:600,col:'#2f7a2f',col2:'#e2504a'},
  okra:{name:'ရုံးပတီ',s:1,grow:4,regrow:2,sell:35,bag:260,col:'#7cc04a',col2:'#f2d35e'},
  corn:{name:'ပြောင်းဖူး',s:1,grow:7,regrow:3,sell:90,bag:400,col:'#f2cf3a',col2:'#fbe68a'},
  rice:{name:'စပါး',s:1,grow:8,regrow:0,sell:150,bag:500,col:'#e0b84a',col2:'#f6dc8a'},
  turnip:{name:'မုန်လာဥ',s:2,grow:4,regrow:0,sell:55,bag:130,col:'#f4eef6',col2:'#a35bb5'},
  potato:{name:'အာလူး',s:2,grow:6,regrow:0,sell:90,bag:220,col:'#c49a5a',col2:'#f6f1d0'},
  cabbage:{name:'ဂေါ်ဖီထုပ်',s:2,grow:8,regrow:0,sell:170,bag:550,col:'#b8e09a',col2:'#7cc46a'},
};
const CROP_IDS=Object.keys(CROPS);
const seasonCrops=s=>CROP_IDS.filter(id=>CROPS[id].s===s);
const EXTRA={egg:{name:'ကြက်ဥ',sell:50},fish:{name:'ငါး',sell:120}};
const TOOLS=[{id:'hoe',name:'ပေါက်ပြား'},{id:'can',name:'ရေပုံး'},{id:'sickle',name:'တံစဉ်'},{id:'hammer',name:'တူ'},{id:'seed',name:'မျိုးစေ့'},{id:'tea',name:'လက်ဖက်ရည်'}];
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const YARD={x0:22,x1:27,y0:11,y1:15};
const FIELD={x0:4,x1:18,y0:9,y1:19};
const DOOR=[5,5],GATE=[29,20];
const KEY='shwepan-farm-v1';
const HMAP=["##########","#S#w##w#K#","#.....BB.#","#.....BB.#","#.tt.....#","#.tt...C.#","#........#","####D#####"];
const HSOLID=new Set(['#','S','w','K','B','t','C']);
const hTile=(x,y)=>(y<0||y>=HMAP.length||x<0||x>=10)?'#':HMAP[y][x];

let S=null;
let mv=null, held=[], paused=true, acc=0, last=0, anim=null, parts=[], chickRT=[], npcRT=[], fade=0;

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return (h^(h>>16))>>>0};
const fmt=n=>n.toLocaleString('en-US');
const inField=(x,y)=>x>=FIELD.x0&&x<=FIELD.x1&&y>=FIELD.y0&&y<=FIELD.y1;
const tileAt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?TREE:S.tiles[y][x];
const npcAt=(x,y)=>npcRT.find(n=>n.active&&((n.x===x&&n.y===y)||(n.t<1&&n.fx===x&&n.fy===y)));
const walkable=(x,y)=>!SOLID.has(tileAt(x,y))&&!npcAt(x,y);
const front=()=>{const d=DIRS[S.dir];return[S.px+d[0],S.py+d[1]]};
let C=ctx;const R=(c,x,y,w,h)=>{C.fillStyle=c;C.fillRect(x,y,w,h)};

/* ---------- world ---------- */
function genMap(seed){
  const rnd=mulberry32(seed),t=[];
  for(let y=0;y<MH;y++){t[y]=[];for(let x=0;x<MW;x++)t[y][x]=G}
  for(let x=0;x<MW;x++){t[0][x]=TREE;t[MH-1][x]=TREE}
  for(let y=0;y<MH;y++){t[y][0]=TREE;t[y][MW-1]=TREE}
  [[1,1],[2,1],[1,2],[11,1],[13,2],[16,1],[19,1],[20,2],[9,2],[1,19],[2,20],[1,20],[28,7],[27,8],[22,7],[1,8],[1,13],[28,19]].forEach(([x,y])=>t[y][x]=TREE);
  for(let y=2;y<=5;y++)for(let x=3;x<=7;x++)t[y][x]=HOUSE;
  for(let y=2;y<=5;y++)for(let x=23;x<=27;x++)t[y][x]=WATER;
  t[6][5]=PATH;for(let x=5;x<=20;x++)t[7][x]=PATH;for(let y=7;y<=20;y++)t[y][20]=PATH;for(let x=20;x<=29;x++)t[20][x]=PATH;
  t[6][9]=BIN;
  for(let x=21;x<=28;x++){t[10][x]=FENCE;t[16][x]=FENCE}
  for(let y=10;y<=16;y++){t[y][21]=FENCE;t[y][28]=FENCE}
  t[13][21]=PATH;t[11][22]=TROUGH;t[19][24]=STALL;t[19][25]=STALL;
  for(let y=FIELD.y0;y<=FIELD.y1;y++)for(let x=FIELD.x0;x<=FIELD.x1;x++){const r=rnd();t[y][x]=r<.3?WEED:r<.42?ROCK:G}
  for(let i=0;i<40;i++){const x=1+Math.floor(rnd()*28),y=1+Math.floor(rnd()*20);if(t[y][x]===G&&!inField(x,y)&&!(x>=21&&y>=10&&y<=16))t[y][x]=FLOWER}
  return t;
}
function fresh(){
  const seeds={},produce={};CROP_IDS.forEach(id=>{seeds[id]=0;produce[id]=0});seeds.kangkong=9;produce.egg=0;produce.fish=0;
  return{day:1,min:360,money:500,energy:100,maxE:100,water:30,canMax:30,weather:'sun',tomorrow:Math.random()<SEASONS[0].rain?'rain':'sun',
    tiles:genMap((Math.random()*1e9)|0),wet:Array.from({length:MH},()=>Array(MW).fill(0)),crops:{},
    seeds,seedSel:'kangkong',produce,shippedValue:0,shippedCount:0,
    feed:0,trough:0,chickens:[],eggs:[],tea:1,px:5,py:6,dir:'down',tool:0,scene:'farm',
    friends:{},talked:{},gifts:{},daily:{},
    stats:{earned:0,harvested:0,eggs:0},over:false};
}
function migrate(s){
  CROP_IDS.forEach(id=>{s.seeds[id]??=0;s.produce[id]??=0});
  s.produce.egg??=0;s.produce.fish??=0;s.scene??='farm';s.friends??={};s.talked??={};s.gifts??={};s.daily??={};
  for(let x=20;x<=29;x++)if(s.tiles[20][x]===TREE||s.tiles[20][x]===G)s.tiles[20][x]=PATH;
  if(!CROPS[s.seedSel]||CROPS[s.seedSel].s!==seasonOf(s.day))s.seedSel=seasonCrops(seasonOf(s.day))[0];
  return s;
}
function save(){if(!S)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(KEY);return s?migrate(JSON.parse(s)):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function syncChickens(){dirty=true;chickRT=S.chickens.map(c=>({x:c.x,y:c.y,tx:c.x,ty:c.y,wait:Math.random()*2,face:1}));resetNPCs()}

/* ---------- villagers ---------- */
const NPCS=[
  {id:'ba',name:'ဦးဘ',role:'အိမ်နီးချင်း ခြံသမားအို',rainSkip:true,plan:[[480,[12,8],120,'down'],[0,[9,7],40,'up']],
    gift:()=>{const id=seasonCrops(curS())[1];S.seeds[id]+=9;return `${CROPS[id].name} မျိုးစေ့ 9 စေ့ ပေးလိုက်တယ်`},
    lines:['ပေါင်းပင်တွေကို အမြဲရှင်းထားပါကွယ်။ ညတိုင်း နည်းနည်းစီ ပြန်ပေါက်တတ်တယ်။','ရေမလောင်းရတဲ့ နေ့က အပင်တွေ မကြီးဘူးနော်။','မင်းအဘိုးလည်း ဒီမြေမှာ တစ်သက်လုံး စိုက်ခဲ့တာ။ မင်းကို မြင်ရတာ ဝမ်းသာတယ်။'],
    season:['နွေရာသီ ပူတယ်။ ကန်စွန်းက မြန်မြန်ထွက်တယ်၊ ဖရဲသီးက ဈေးကောင်းတယ်။','မိုးရာသီဆို စပါးစိုက်ရမယ်ကွယ်။ မိုးရွာတဲ့နေ့ ရေလောင်းစရာ မလိုဘူး။','ဆောင်းမှာ ဂေါ်ဖီထုပ်နဲ့ အာလူး ကောင်းတယ်။ မနက်ခင်း မြူဆိုင်းနေတာ လှတယ်နော်။']},
  {id:'mya',name:'မမြ',role:'ရွာက ပန်းသည်',rainSkip:false,plan:[[600,[25,20],60,'up'],[0,[20,13],40,'right'],[0,[6,7],30,'up']],
    gift:()=>{S.tea+=3;return 'လက်ဖက်ရည် 3 ခွက် ပေးလိုက်တယ်'},
    lines:['ဒီနေ့ ဈေးထဲမှာ ကြက်ဥ ဈေးကောင်းတယ်တဲ့။','သနပ်ခါး လိမ်းထားတော့ နေပူလည်း အေးတယ်။','ရွာကို ကယ်ဖို့ ငါတို့လည်း ဆုတောင်းပေးနေတယ်နော်။'],
    season:['သင်္ကြန်ရောက်ရင် ရေပက်ကြမယ်နော်။ ပိတောက်ပန်းတွေ ပွင့်နေပြီ။','မိုးတွင်းဆို လမ်းတွေ ရွှံ့ထူတယ်။ ချော်မလဲနဲ့နော်။','ဆောင်းတွင်း မနက်ဆို အေးတယ်။ လက်ဖက်ရည် ပူပူလေး သောက်ရတာ ကောင်းတယ်။']},
  {id:'aung',name:'ကိုအောင်',role:'ငါးမျှားဝါသနာရှင်',rainSkip:true,fish:true,plan:[[840,[25,6],150,'up']],

function resetNPCs(){npcRT=NPCS.map(()=>({active:false,done:false,x:GATE[0],y:GATE[1],fx:GATE[0],fy:GATE[1],t:1,path:[],leg:0,wait:0,leaving:false,dir:'left',steps:0}))}
function bfs(sx,sy,tx,ty){
  const ok=(x,y)=>{const t=tileAt(x,y);return t===PATH||t===G||t===FLOWER},key=(x,y)=>y*MW+x,prev=new Map(),q=[[sx,sy]];prev.set(key(sx,sy),-1);
  while(q.length){const [x,y]=q.shift();
    if(x===tx&&y===ty){const p=[];let k=key(x,y);while(k!==key(sx,sy)){p.unshift([k%MW,(k/MW)|0]);k=prev.get(k)}return p}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx<0||ny<0||nx>=MW||ny>=MH||prev.has(k)||!ok(nx,ny))continue;prev.set(k,key(x,y));q.push([nx,ny])}}
  return [];
}
const dirOf=(dx,dy)=>dx>0?'right':dx<0?'left':dy>0?'down':'up';
function updateNPCs(dt){
  NPCS.forEach((d,i)=>{const n=npcRT[i];if(!n||n.done)return;
    if(!n.active){
      if(S.min>=d.plan[0][0]&&S.min<1020&&!(d.rainSkip&&S.weather==='rain')){Object.assign(n,{active:true,x:GATE[0],y:GATE[1],fx:GATE[0],fy:GATE[1],t:1,leg:0,wait:0,leaving:false});n.path=bfs(n.x,n.y,...d.plan[0][1])}
      return;
    }
    if(n.t<1){n.t=Math.min(1,n.t+dt/230);return}
    if(n.path.length){const [nx,ny]=n.path[0];
      if(S.scene==='farm'&&S.px===nx&&S.py===ny)return;
      n.path.shift();n.fx=n.x;n.fy=n.y;n.dir=dirOf(nx-n.x,ny-n.y);n.x=nx;n.y=ny;n.t=0;n.steps++;return}
    if(n.leaving){n.active=false;n.done=true;return}
    const leg=d.plan[n.leg];
    if(!n.wait){n.wait=S.min+leg[2];n.dir=leg[3]}
    if(S.min>=n.wait||S.min>=1080){n.wait=0;n.leg++;
      if(n.leg<d.plan.length&&S.min<1080){const tg=d.plan[n.leg][1];n.path=bfs(n.x,n.y,tg[0],tg[1])}
      else{n.leaving=true;n.path=bfs(n.x,n.y,GATE[0],GATE[1])}}
  });
}

function burst(x,y,col,n=6){for(let i=0;i<n;i++)parts.push({x:x*T+8,y:y*T+8,vx:(Math.random()-.5)*60,vy:-Math.random()*60-10,life:400,col})}

function enterHouse(){S.scene='house';S.px=4;S.py=6;S.dir='up';mv=null;fade=1}
function exitHouse(){S.scene='farm';S.px=5;S.py=6;S.dir='down';mv=null;fade=1}
function tryMove(d){
  S.dir=d;const[dx,dy]=DIRS[d],nx=S.px+dx,ny=S.py+dy;
  if(S.scene==='farm'){
    if(nx===DOOR[0]&&ny===DOOR[1])return enterHouse();
    if(walkable(nx,ny)){mv={fx:S.px,fy:S.py,t:0};S.px=nx;S.py=ny;stepCount++}

    if(c==='D')return exitHouse();

}

function actHouse(c){

function ship(){
  let n=0,v=0;
  CROP_IDS.forEach(id=>{n+=S.produce[id];v+=S.produce[id]*CROPS[id].sell;S.produce[id]=0});
  for(const id in EXTRA){n+=S.produce[id];v+=S.produce[id]*EXTRA[id].sell;S.produce[id]=0}
  if(!n)return toast('ပို့စရာ မရှိသေးဘူး။ ရိတ်သိမ်းထားတာကို ဒီပုံးထဲ ထည့်ပါ');
  S.shippedValue+=v;S.shippedCount+=n;
  toast(`${n} ခု ပို့လိုက်ပြီ (+${fmt(v)} ကျပ်)။ မနက်ဖြန် ငွေရမယ်`);
}
function feedChickens(){
  const need=S.chickens.length-S.trough;
  if(!S.chickens.length)return toast('ကြက် မရှိသေးဘူး။ ဈေးဆိုင်မှာ ဝယ်လို့ရတယ်');
  if(need<=0)return toast('ကြက်စာ ပြည့်နေပြီ');
  if(S.feed<=0)return toast('ကြက်စာ မရှိဘူး။ ဈေးဆိုင်မှာ ဝယ်ပါ');
  const put=Math.min(need,S.feed);S.feed-=put;S.trough+=put;
  toast(`ကြက်စာ ${put} ခွက် ထည့်လိုက်တယ် (${S.trough}/${S.chickens.length})`);
}

/* ---------- day cycle ---------- */
function endDay(passedOut){
  const income=S.shippedValue,count=S.shippedCount,oldS=curS();
  S.money+=income;S.stats.earned+=income;S.shippedValue=0;S.shippedCount=0;
  for(const k in S.crops){const [x,y]=k.split(',').map(Number);if(S.wet[y][x]&&!S.crops[k].dead)S.crops[k].age++}
  for(let y=0;y<MH;y++)S.wet[y].fill(0);
  const fed=Math.min(S.trough,S.chickens.length);S.trough=0;let laid=0;
  for(let i=0;i<fed&&S.eggs.length<14;i++){
    for(let tries=0;tries<20;tries++){
      const x=YARD.x0+Math.floor(Math.random()*(YARD.x1-YARD.x0+1)),y=YARD.y0+Math.floor(Math.random()*(YARD.y1-YARD.y0+1));
      if(S.tiles[y][x]===G&&!S.eggs.some(e=>e.x===x&&e.y===y)){S.eggs.push({x,y});laid++;break}
    }
  }
  for(let i=0;i<5;i++){const x=FIELD.x0+Math.floor(Math.random()*15),y=FIELD.y0+Math.floor(Math.random()*11);if(S.tiles[y][x]===G)S.tiles[y][x]=WEED}
  if(S.day>=DAYS){S.over=true;save();return ending()}
  S.day++;
  const ns=curS();let withered=0;
  if(ns!==oldS){for(const k in S.crops){const c=S.crops[k];if(CROPS[c.type].s!==ns&&!c.dead){c.dead=true;withered++}}S.seedSel=seasonCrops(ns)[0]}
  S.weather=S.tomorrow;S.tomorrow=Math.random()<SEASONS[seasonOf(Math.min(DAYS,S.day+1))].rain?'rain':'sun';
  if(S.weather==='rain')for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(S.tiles[y][x]===SOIL)S.wet[y][x]=1;
  S.min=360;S.energy=passedOut?60:S.maxE;S.scene='house';S.px=5;S.py=3;S.dir='down';mv=null;
  S.talked={};S.daily={};
  syncChickens();dirty=true;save();
  morning(income,count,laid,passedOut,ns!==oldS,withered);
}

function close(){modal.hidden=true;paused=false;last=performance.now();hud();belt()}
modal.addEventListener('click',e=>{if(e.target===modal&&!S.over&&card.dataset.dismiss!=='no')close()});

function bag(){
  const rows=[];
  CROP_IDS.forEach(id=>S.seeds[id]&&rows.push(`<span>${CROPS[id].name} မျိုးစေ့${CROPS[id].s!==curS()?' (ရာသီမဟုတ်)':''}</span><span>${S.seeds[id]}</span>`));
  CROP_IDS.forEach(id=>S.produce[id]&&rows.push(`<span>${CROPS[id].name} (မပို့ရသေး)</span><span>${S.produce[id]}</span>`));
  for(const id in EXTRA)if(S.produce[id])rows.push(`<span>${EXTRA[id].name} (မပို့ရသေး)</span><span>${S.produce[id]}</span>`);
  rows.push(`<span>ရေပုံးထဲက ရေ</span><span>${S.water}/${S.canMax}</span>`,`<span>ကြက်</span><span>${S.chickens.length}</span>`,`<span>ကြက်စာ</span><span>${S.feed}</span>`,`<span>လက်ဖက်ရည်</span><span>${S.tea}</span>`);
  if(S.shippedValue)rows.push(`<span>ဒီနေ့ ပို့ထားတာ</span><span>+${fmt(S.shippedValue)}</span>`);
  show(`<h2>အိတ်</h2><div class="kv">${rows.join('')}</div>
  <p class="sub">ဒီရာသီ ဈေးနှုန်း: ${seasonCrops(curS()).map(id=>`${CROPS[id].name} ${CROPS[id].sell}`).join('၊ ')}၊ ကြက်ဥ ${EXTRA.egg.sell}၊ ငါး ${EXTRA.fish.sell} ကျပ်</p>
  <div class="btns"><button class="bt pri" type="button" id="mC">ပိတ်မယ်</button><button class="bt" type="button" id="mHelp">ဘယ်လိုဆော့ရမလဲ</button></div>`,c=>{c.querySelector('#mC').onclick=close;c.querySelector('#mHelp').onclick=help});

  <li>ရွာသားတစ်ယောက်ကို နေ့တိုင်း စကားပြောရင် ခင်မင်မှု တက်မယ်။ ♥ 3 ရရင် လက်ဆောင် ပေးမယ်</li>

function openShop(){
  if(S.min<480||S.min>=1080)return toast('ဈေးဆိုင် ပိတ်ထားတယ်။ ဖွင့်ချိန် 8:00 – 18:00');
  const s=curS();
  const items=[
    ...seasonCrops(s).map(id=>{const d=CROPS[id];return{id:'s_'+id,label:`${d.name} မျိုးစေ့ (9 စေ့)`,desc:`${d.grow} ရက်နဲ့ ရင့်တယ် · တစ်ခု ${d.sell} ကျပ်${d.regrow?` · ${d.regrow} ရက်တစ်ခါ ထပ်သီးတယ်`:''}`,price:d.bag,ok:()=>true,buy:()=>{S.seeds[id]+=9;S.seedSel=id}}}),
    {id:'tea',label:'လက်ဖက်ရည် တစ်ခွက်',desc:'အားအင် +40 · ကိရိယာ အကွက်ကနေ သောက်ပါ',price:60,ok:()=>true,buy:()=>S.tea++},
    {id:'feed',label:'ကြက်စာ 5 ခွက်',desc:'ကြက်တစ်ကောင် တစ်ရက် တစ်ခွက်',price:50,ok:()=>true,buy:()=>S.feed+=5},
    {id:'hen',label:'ကြက်မ တစ်ကောင်',desc:'',price:500,ok:()=>S.chickens.length<6,buy:()=>{S.chickens.push({x:24+Math.random()*2,y:13});syncChickens()}},
    {id:'can',label:'ရေပုံးကြီး',desc:'ရေ 30 ကနေ 80 အထိ ဆံ့မယ်',price:1200,ok:()=>S.canMax<80,buy:()=>{S.canMax=80;S.water=80}},
  ];
  const hen=items.find(i=>i.id==='hen');
  const render=()=>{hen.desc=`စာကျွေးရင် နေ့တိုင်း ဥတယ် · အများဆုံး 6 ကောင် (${S.chickens.length}/6)`;
    return `<h2>ဒေါ်ခင်ရဲ့ ဈေးဆိုင်</h2><p class="sub">${SEASONS[s].name}ရာသီ မျိုးစေ့တွေ ရောက်နေတယ် · ငွေ ${fmt(S.money)} ကျပ် ရှိတယ်</p>
    ${items.map(it=>`<div class="item"><b>${it.label}</b><span class="sub">${it.desc}</span><button class="bt" type="button" data-buy="${it.id}" ${(!it.ok()||S.money<it.price)?'disabled':''}>${fmt(it.price)} ကျပ်</button></div>`).join('')}
    <div class="btns"><button class="bt pri" type="button" id="mC">ပြန်မယ်</button></div>`};
  const bind=c=>{
    c.querySelector('#mC').onclick=close;
    c.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
      const it=items.find(i=>i.id===b.dataset.buy);if(!it.ok()||S.money<it.price)return;
      S.money-=it.price;it.buy();
      c.innerHTML=render();bind(c);hud();belt();
      const again=c.querySelector(`[data-buy="${it.id}"]`);(again&&!again.disabled?again:c.querySelector('#mC')).focus();
    });
  };
  show(render(),bind);
}

/* ---------- HUD & belt ---------- */
const $=id=>document.getElementById(id);
const hudCache={};
function setT(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v}}
function hud(){
  if(!S)return;
  const h=Math.floor(S.min/60)%24,m=S.min%60;
  setT('hDay',`နေ့ ${S.day} / ${DAYS}`);
  setT('hTime',`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  setT('hWx',`${SEASONS[curS()].name} · ${S.weather==='rain'?'မိုးရွာ':'နေသာ'}`);
  setT('hMoney',`${fmt(S.money)} ကျပ်`);
  setT('gTxt',`${fmt(S.money)} / ${fmt(GOAL)}`);
  $('eBar').style.width=(S.energy/S.maxE*100)+'%';
  $('eBar').style.background=S.energy<20?'var(--danger)':'';
  $('gBar').style.width=Math.min(100,S.money/GOAL*100)+'%';
}
const beltEl=$('belt');const slotEls=[];
TOOLS.forEach((t,i)=>{
  const b=document.createElement('button');b.type='button';b.className='slot';
  b.innerHTML=`<canvas width="16" height="16"></canvas><span></span><small></small>`;
  b.onclick=()=>{if(paused)return;if(S.tool===i&&t.id==='seed')cycleSeed();S.tool=i;belt()};
  beltEl.appendChild(b);slotEls.push(b);
});
function cycleSeed(){const list=seasonCrops(curS()),i=list.indexOf(S.seedSel);S.seedSel=list[(i+1)%list.length];toast(`${CROPS[S.seedSel].name} မျိုးစေ့ (${S.seeds[S.seedSel]} စေ့)`)}
function belt(){
  if(!S)return;
  slotEls.forEach((b,i)=>{
    const t=TOOLS[i];b.classList.toggle('on',S.tool===i);
    b.querySelector('span').textContent=t.id==='seed'?CROPS[S.seedSel].name:t.name;
    b.querySelector('small').textContent=t.id==='can'?`${S.water}/${S.canMax}`:t.id==='seed'?`×${S.seeds[S.seedSel]}`:t.id==='tea'?`×${S.tea}`:String(i+1);
    drawIcon(b.querySelector('canvas').getContext('2d'),t.id);
  });
}

function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on')}
  parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=200*dt/1000});
  if(anim&&(anim.t-=dt)<=0)anim=null;
  if(fade>0)fade=Math.max(0,fade-dt/300);
  if(paused||!S)return;
  acc+=dt;while(acc>=TICK){acc-=TICK;S.min++;if(S.min%60===0)save()}
  if(S.min>=1440){toast('');endDay(true);return}
  if(mv){mv.t+=dt/140;if(mv.t>=1)mv=null}
  if(!mv&&held.length&&fade<.5)tryMove(held[held.length-1]);
  updateNPCs(dt);
  const night=S.min>=1140;
  chickRT.forEach(c=>{
    if(night)return;
    if(c.wait>0){c.wait-=dt/1000;return}
    const dx=c.tx-c.x,dy=c.ty-c.y,dist=Math.hypot(dx,dy);
    if(dist<.05){c.tx=YARD.x0+Math.random()*(YARD.x1-YARD.x0);c.ty=YARD.y0+.3+Math.random()*(YARD.y1-YARD.y0-.3);c.wait=.8+Math.random()*2.5;return}
    const sp=.9*dt/1000;c.x+=dx/dist*Math.min(sp,dist);c.y+=dy/dist*Math.min(sp,dist);if(Math.abs(dx)>.01)c.face=dx>0?1:-1;
  });
  chickRT.forEach((c,i)=>{if(S.chickens[i]){S.chickens[i].x=c.x;S.chickens[i].y=c.y}});
}

  for(let i=0;i<4;i++)for(let j=0;j<3;j++)R('#8a7a6a',kx+4+i*2,ky+6+j*2,1,1);R(['#e2402f','#3f86c9','#7fa556'][curS()],kx+4+((S.day-1)%4)*2,ky+6+(((S.day-1)>>2)%3)*2,1,1);
  // lamp
  R('#3a2414',X(5),Y(1)+8,1,10);OL([['#c99a40',X(5)-2,Y(1)+18,5,5]],'#3a2414');R(night?'#ffe08a':'#e8c86a',X(5)-1,Y(1)+19,3,3);
  const[rx,ry]=playerPos();drawPlayer(Math.round(ox+rx*T),Math.round(oy+ry*T)-7);
  if(!paused){const[fx,fy]=front();if(HSOLID.has(hTile(fx,fy))&&fy>0)marker(ox+fx*T,oy+fy*T,now)}

    const g=C.createRadialGradient(X(5),Y(1)+20,0,X(5),Y(1)+20,70);g.addColorStop(0,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,170,70,0)');C.fillStyle=g;C.fillRect(0,0,W,H);C.globalCompositeOperation='source-over'}
}

/* ----- farm ----- */
function render(now){
  C=ctx;ctx.setTransform(SCALE,0,0,SCALE,0,0);ctx.imageSmoothingEnabled=false;
  if(!S){R('#3a6b2a',0,0,VW*T,VH*T);return}
  if(S.scene==='house'){renderHouse(now);if(fade>0){R(`rgba(0,0,0,${fade})`,0,0,VW*T,VH*T)}return}
  if(dirty){buildBG();dirty=false}
  const[rx,ry]=playerPos(),s=curS();
  const cx=Math.round(Math.max(0,Math.min(MW*T-VW*T,rx*T+8-VW*T/2)));
  const cy=Math.round(Math.max(0,Math.min(MH*T-VH*T,ry*T+8-VH*T/2)));
  const x0=Math.floor(cx/T),y0=Math.floor(cy/T),day=S.min<1080,open=S.min>=480&&S.min<1080;
  ctx.drawImage(BG,cx,cy,VW*T,VH*T,0,0,VW*T,VH*T);
  for(let y=y0;y<=y0+VH&&y<MH;y++)for(let x=x0;x<=x0+VW&&x<MW;x++)if(S.tiles[y][x]===WATER)drawWater(x,y,x*T-cx,y*T-cy,now);
  for(const k in S.crops){const [x,y]=k.split(',').map(Number);if(x>=x0-1&&x<=x0+VW+1&&y>=y0-1&&y<=y0+VH+2)drawCrop(S.crops[k],x*T-cx,y*T-cy,now,x,y)}
  S.eggs.forEach(e=>{const sx=e.x*T-cx,sy=e.y*T-cy;R('rgba(0,0,0,.2)',sx+4,sy+12,8,2);disc('#6a5a40',sx+8,sy+9,4);disc('#f7efdc',sx+8,sy+9,3);R('#fffdf6',sx+6,sy+7,2,2)});
  if(!paused){const [fx,fy]=front();marker(fx*T-cx,fy*T-cy,now)}
  const sprites=[];
  sprites.push({y:5.95,d:()=>{C.drawImage(HOUSE_SPR,3*T-cx-4,2*T-cy-6);
    if(!day){[[3*T+10,2*T+29],[3*T+58,2*T+29]].forEach(([wx,wy])=>{R('#f8d77a',wx-cx,wy-cy,12,8);R('#4a2f1c',wx-cx+5,wy-cy,2,8);R('#fff2b8',wx-cx,wy-cy,3,2)})}}});
  for(let y=y0;y<=y0+VH+2&&y<MH;y++)for(let x=x0-1;x<=x0+VW&&x<MW;x++){if(x<0||S.tiles[y][x]!==TREE)continue;
    sprites.push({y:y+.9,d:()=>C.drawImage(TREES[s][hash(x,y)%5===0?1:0],x*T-cx-8,y*T-cy-22)})}
  if(open){const f=((now/700)|0)%2;sprites.push({y:18.5,d:()=>C.drawImage(MS.down[0],Math.round(24.5*T-cx),18*T-cy-7+f)})}
  sprites.push({y:19.2,d:()=>{const sx=24*T-cx,sy=19*T-cy;
    OL([['#8a5a30',sx,sy+4,32,10]],'#2e1d10');R('#a8703a',sx,sy+4,32,2);R('#6b4426',sx,sy+9,32,1);R('rgba(0,0,0,.25)',sx,sy+14,32,2);
    seasonCrops(s).concat(['egg']).forEach((id,i)=>{const col=id==='egg'?'#f7efdc':CROPS[id].col,col2=id==='egg'?'#ffffff':CROPS[id].col2,o=2+i*8;OL([['#b08a50',sx+o,sy+1,6,4]],'#4a3416');R(col,sx+o+1,sy,4,2);R(col2,sx+o+2,sy-1,2,1)})}});
  chickRT.forEach((c,i)=>sprites.push({y:c.y,d:()=>{const bob=!(((now/220+i)|0)%3)?1:0,px=Math.round(c.x*T-cx)+2,py=Math.round(c.y*T-cy)+3;
    R('rgba(0,0,0,.2)',px+2,py+11,8,2);C.drawImage(c.face>0?HENR:HENL,px,py+bob)}}));
  npcRT.forEach((n,i)=>{if(!n.active)return;const d=NPCS[i],k=n.t,nx=n.fx+(n.x-n.fx)*k,ny=n.fy+(n.y-n.fy)*k;
    sprites.push({y:ny+.005,d:()=>{const px=Math.round(nx*T-cx),py=Math.round(ny*T-cy)-7,fr=n.t<1?(n.steps%2?1:2):0;
      R('rgba(0,0,0,.25)',px+4,py+21,8,2);C.drawImage(NS[d.id][n.dir][fr],px,py);
      if(d.fish&&n.t>=1&&!n.path.length&&n.wait){const bob=((now/500)|0)%2;R('#6b4a2b',px+11,py+2,1,8);R('#6b4a2b',px+12,py-2,1,4);R('#6b4a2b',px+13,py-5,1,3);
        R('rgba(255,255,255,.6)',px+14,py-5,1,8);R('#e2402f',px+14,py+3+bob,2,2);R('#ffffff',px+14,py+3+bob,1,1)}
      if(n.wait&&!n.path.length&&!d.fish&&((now/1600)|0)%5===0){R('#ffffff',px+6,py-12,9,7);R('#ffffff',px+8,py-5,2,2);R('#2a1a12',px+8,py-9,1,1);R('#2a1a12',px+10,py-9,1,1);R('#2a1a12',px+12,py-9,1,1)}}})});
  sprites.push({y:ry+.01,d:()=>drawPlayer(Math.round(rx*T-cx),Math.round(ry*T-cy)-7)});
  sprites.sort((a,b)=>a.y-b.y).forEach(sp=>sp.d());
  if(open||!day){const sx=24*T-cx,sy=18*T-cy;
    R('#5a3b22',sx,sy-6,2,22);R('#5a3b22',sx+30,sy-6,2,22);
    if(open){R('#3a2414',sx-1,sy-11,34,1);for(let i=0;i<8;i++){const c=i%2?'#f6efe0':'#c8433a';R(c,sx+i*4,sy-10,4,5);R(c,sx+i*4+1,sy-5,2,1)}R('rgba(0,0,0,.25)',sx,sy-4,32,1)}
    const lx=sx+29,ly=sy-3;R('#2a1a10',lx,ly,4,6);R(day?'#c99a40':'#ffd36a',lx+1,ly+1,2,4);R('#2a1a10',lx+1,ly-1,2,1)}
  parts.forEach(p=>{C.globalAlpha=Math.min(1,p.life/250);R(p.col,p.x-cx,p.y-cy,2,2)});C.globalAlpha=1;
  if(day&&S.weather!=='rain'){
    butterflies.forEach(b=>{const t=now/1000+b.ph;b.x+=Math.sin(t*.7)*.35;b.y+=Math.cos(t*.9)*.25;
      b.x=Math.max(16,Math.min(MW*T-16,b.x));b.y=Math.max(16,Math.min(MH*T-16,b.y));
      const x=Math.round(b.x-cx),y=Math.round(b.y-cy+Math.sin(t*6)*2),fl=((now/120+b.ph)|0)%2;
      R('#2a1a10',x,y,1,2);if(fl){R(b.col,x-2,y-1,2,2);R(b.col,x+1,y-1,2,2)}else{R(b.col,x-1,y,1,1);R(b.col,x+1,y,1,1)}});
    C.imageSmoothingEnabled=true;C.fillStyle='rgba(20,45,30,.09)';
    for(let i=0;i<3;i++){const x=((now*.006+i*190)%(MW*T+240))-120-cx,y=((i*157)%(MH*T-80))+40-cy;C.beginPath();C.ellipse(x,y,64,26,0,0,Math.PI*2);C.ellipse(x+40,y+10,40,20,0,0,Math.PI*2);C.fill()}
    C.imageSmoothingEnabled=false;
  }
  if(s!==1||S.weather!=='rain'){const W=VW*T,H=VH*T,cols=s===0?['#f6c829','#ffe46a']:s===2?['#e09a3a','#c8702a']:null;
    if(cols)for(let i=0;i<(s===2?10:7);i++){const t=now/1000+i*3.1,x=((i*61+t*14+Math.sin(t*1.3+i)*10)%(W+20)+W+20)%(W+20)-10,y=((i*43+t*(s===2?16:10))%(H+20))-10;R(cols[i%2],x|0,y|0,2,1);R(cols[(i+1)%2],(x|0)+((t*4|0)%2),(y|0)+1,1,1)}}
  if(S.weather==='rain'){
    R('rgba(30,50,90,.16)',0,0,VW*T,VH*T);
    for(let i=0;i<55;i++){const x=(i*37+now*.12)%(VW*T),y=(i*53+now*.32)%(VH*T);R('rgba(200,225,255,.55)',x|0,y|0,1,5)}
    if(Math.random()<.6)drops.push({x:Math.random()*VW*T|0,y:Math.random()*VH*T|0,l:300});
    drops=drops.filter(d=>(d.l-=16)>0);drops.forEach(d=>{const r=d.l>150?1:2;C.globalAlpha=d.l/300;R('#d8ebff',d.x-r,d.y,r*2+1,1);R('#d8ebff',d.x,d.y-1,1,1)});C.globalAlpha=1;
  }
  lighting(cx,cy,rx,ry,now);
  if(S.min>=1110&&S.weather!=='rain')flies.forEach(f=>{const t=now/1000+f.ph,x=Math.round(f.x+Math.sin(t*.6)*14-cx),y=Math.round(f.y+Math.cos(t*.8)*9-cy),a=(Math.sin(t*3)+1)/2;
    if(a>.3){C.globalAlpha=a*.35;R('#d8ff8a',x-1,y-1,3,3);C.globalAlpha=a;R('#f2ffb0',x,y,1,1);C.globalAlpha=1}});
  if(fade>0)R(`rgba(0,0,0,${fade})`,0,0,VW*T,VH*T);
}
let lastSeason=-1;
function loop(now){
  const dt=Math.min(100,now-(last||now));last=now;
  if(S&&curS()!==lastSeason){lastSeason=curS();dirty=true}
  update(dt);render(now);hud();
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
function start(data){
  fit();
  if(data&&data.s){try{S=migrate(JSON.parse(data.s));syncChickens();paused=false;belt();hud()}catch(e){S=null}}
  if(!S){
    const sv=loadSave();S=sv&&!sv.over?sv:fresh();syncChickens();belt();hud();intro();
  }
  requestAnimationFrame(loop);
  setTimeout(fit,300);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}
window.claude?.hot?.snapshot?.(()=>({s:S&&modal.hidden?JSON.stringify(S):null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
