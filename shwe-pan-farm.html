<title>Shwe Pan Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=VT323&display=swap">
<style>
:root{
  /* Layout: one-screen game. HUD strip, pixel stage, tool belt, touch pad. Single dark "teak wood" look by choice. */
  --wood:#22190f;
  --wood-2:#352617;
  --plank:#5b4128;
  --paper:#f1e2c2;
  --muted:#c2ab84;
  --leaf:#8fd16a;
  --gold:#f2c14e;
  --sky:#7cc4f0;
  --danger:#ef7a5d;
  --display:'VT323','Padauk',system-ui,sans-serif;
  --body:'Padauk','VT323',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wood);color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}

#hud{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{font-size:19px;background:var(--wood-2);border:1px solid var(--plank);border-radius:6px;padding:2px 8px;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.6}
.chip.gold{color:var(--gold)}
.chip.btn:hover{border-color:var(--gold)}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bar{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--muted)}
.bar i{flex:1;height:10px;background:#120d08;border:1px solid var(--plank);border-radius:3px;overflow:hidden;min-width:40px}
.bar b{display:block;height:100%;background:var(--leaf);transition:width .3s}
.bar b.g{background:var(--gold)}
.bar em{font-style:normal;font-family:var(--display);color:var(--paper);font-size:16px;white-space:nowrap}

#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--plank);border-radius:6px;background:#3a6b2a;touch-action:none;max-width:100%}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(20,14,8,.88);border:1px solid var(--plank);border-radius:8px;padding:4px 12px;font-size:14px;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#dlg{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:10px;align-items:flex-start;background:rgba(30,21,13,.95);border:2px solid var(--gold);border-radius:10px;padding:10px 12px 14px;z-index:5;cursor:pointer;max-height:80%;overflow:auto}
#dlgFace{width:72px;height:90px;border:1px solid var(--plank);border-radius:6px;flex:none}
#dlg .dt{flex:1;min-width:0}
#dlgName{color:var(--gold);font-size:14px}
#dlgText{margin:2px 0 0;line-height:1.8;font-size:15px}
#dlgOpts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dlgOpts button{text-align:left;background:var(--plank);border:2px solid #7a5a38;border-radius:8px;padding:5px 10px;line-height:1.6}
#dlgOpts button.sel{border-color:var(--gold);background:#6a4a2a}
#dlgMore{position:absolute;right:10px;bottom:2px;color:var(--gold);font-size:12px}
.card.letter{background:#efe2c4;color:#3a2a18;border-color:#b89a6a}
.card.letter h2{color:#7a3a20}
.card.letter p{line-height:1.9}
.tk{display:flex;gap:12px;align-items:flex-start}
.pt{width:84px;height:105px;border-radius:8px;border:2px solid var(--plank);flex:none}
.qp{grid-row:1/3;grid-column:2;font-family:var(--display);color:var(--gold);font-size:18px}

#belt{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.slot.off{opacity:.4}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--wood-2);border:2px solid var(--plank);border-radius:8px;padding:4px 2px;min-width:0}
.slot canvas{width:28px;height:28px;image-rendering:pixelated}
.slot span{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot small{font-family:var(--display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.on{border-color:var(--gold);background:#4a3520}

#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,48px);gap:3px}
.dpad button,.ab button{background:var(--wood-2);border:2px solid var(--plank);border-radius:10px;font-family:var(--display);font-size:18px;touch-action:none}
.dpad button:active,.dpad button.held,.ab button:active{background:var(--plank)}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;line-height:1.1}
.ab button b{font-family:var(--display);font-size:22px}
.ab button small{font-size:11px;color:var(--muted)}
.ab .a{border-color:#7a9a4a}
.ab .b{border-color:#9a6a3a;transform:translateY(-18px)}
#keys{display:none;text-align:center;color:var(--muted);font-size:13px}
@media (hover:hover) and (pointer:fine){#pad{display:none}#keys{display:block}}

#modal{position:fixed;inset:0;background:rgba(10,7,4,.72);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.card{background:var(--wood-2);border:3px solid var(--plank);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:86vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-family:var(--display);font-size:22px;color:var(--gold);text-wrap:balance;line-height:1.5}
.card h2.big{font-size:30px}
.card p{margin:0;line-height:1.8}
.card .sub{color:var(--muted);font-size:13px}
.card ul{margin:0;padding-left:18px;line-height:1.8}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bt{background:var(--plank);border:2px solid #7a5a38;border-radius:8px;padding:6px 14px}
.bt.pri{background:#4d6b2a;border-color:var(--leaf)}
.bt:disabled{opacity:.4;cursor:default}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--plank)}
.item b{font-weight:700}
.item .sub{grid-column:1}
.item .bt{grid-row:1/3;grid-column:2;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){font-family:var(--display);text-align:right}
.hearts{color:var(--danger);letter-spacing:2px;font-size:16px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,44px)}.ab button{width:62px;height:62px}}
@media (prefers-reduced-motion:reduce){#toast,.bar b{transition:none}}
#fsBtn{display:none}
/* phone held sideways: game fills the whole screen, controls float on top of it */
@media (orientation:landscape) and (max-height:600px) and (hover:none){
  #app{max-width:none;padding:0;display:block;position:fixed;inset:0;height:auto}
  #stage{position:fixed;inset:0;display:block;overflow:hidden}
  #cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:0;max-width:none}
  #hud{position:fixed;z-index:3;top:max(4px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));grid-template-columns:auto minmax(90px,1fr) auto;gap:4px 8px;pointer-events:none}
  #hud .row{gap:4px;flex-wrap:nowrap}#hud button{pointer-events:auto}
  #hud .bars{grid-column:2;grid-row:1;grid-template-columns:1fr 1.3fr;gap:8px;min-width:0}
  #hud .bar{min-width:0}#hud .bar>span,#hud .bar em,#hWx{display:none}#hud .bar i{min-width:24px}
  .chip{font-size:14px;line-height:1.3;padding:1px 6px;background:rgba(34,25,15,.72);backdrop-filter:blur(2px)}
  #belt{position:fixed;z-index:3;bottom:max(4px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(56vw,460px);gap:3px}
  .slot{padding:2px 1px;border-radius:6px;background:rgba(53,38,23,.72)}.slot.on{background:rgba(74,53,32,.85)}.slot span{display:none}.slot canvas{width:20px;height:20px}.slot small{font-size:12px;line-height:1}
  #pad{display:contents}
  .dpad{position:fixed;z-index:3;left:max(10px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,46px);opacity:.82}
  .ab{position:fixed;z-index:3;right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));gap:12px;opacity:.85}
  .dpad button,.ab button{background:rgba(34,25,15,.55);border-color:rgba(242,193,78,.35)}
  .ab button{width:64px;height:64px}.ab .b{transform:translateY(-30px)}
  #keys{display:none}#toast{bottom:64px}
  #dlg{position:fixed;left:50%;transform:translateX(-50%);width:min(64vw,560px);right:auto;bottom:max(58px,env(safe-area-inset-bottom,0px));padding:6px 10px 10px}#dlgFace{width:56px;height:70px}#dlgText{font-size:14px;line-height:1.6}
  .card{max-height:92vh;padding:12px}
  #fsBtn{display:block}
}

</style>

<div id="app">
  <header id="hud">
    <div class="row"><span class="chip" id="hDay"></span><span class="chip" id="hTime"></span><span class="chip" id="hWx"></span></div>
    <div class="row"><span class="chip gold" id="hMoney"></span><button class="chip btn" id="bQuest" type="button">မှတ်စု</button><button class="chip btn" id="bBag" type="button">အိတ်</button><button class="chip btn" id="fsBtn" type="button" aria-label="Full screen">⛶</button></div>
    <div class="bars">
      <div class="bar"><span>အားအင်</span><i><b id="eBar"></b></i></div>
      <div class="bar"><span>သံသယ</span><i><b id="gBar" class="g"></b></i><em id="gTxt"></em></div>
    </div>
  </header>
  <main id="stage"><canvas id="cv" aria-label="ခြံ မြေပုံ"></canvas><div id="toast" role="status"></div><div id="dlg" hidden><canvas id="dlgFace" width="192" height="240"></canvas><div class="dt"><b id="dlgName"></b><p id="dlgText"></p><div id="dlgOpts"></div></div><span id="dlgMore" hidden>▼ ဆက်ရန်</span></div></main>
  <nav id="belt" aria-label="ကိရိယာများ"></nav>
  <section id="pad">
    <div class="dpad">
      <span></span><button type="button" data-d="up" aria-label="အပေါ်">▲</button><span></span>
      <button type="button" data-d="left" aria-label="ဘယ်">◀</button><span></span><button type="button" data-d="right" aria-label="ညာ">▶</button>
      <span></span><button type="button" data-d="down" aria-label="အောက်">▼</button><span></span>
    </div>
    <div class="ab">
      <button type="button" class="a" id="btnA"><span><b>A</b><br><small>သုံးမယ်</small></span></button>
      <button type="button" class="b" id="btnB"><span><b>B</b><br><small>ကိုင်မယ်</small></span></button>
    </div>
  </section>
  <div id="keys">မြှားခလုတ် / WASD လမ်းလျှောက် · Z / Space ကိရိယာသုံး · X / Enter ရိတ်၊ ကောက်၊ ပို့၊ အိပ် · 1–9 ကိရိယာရွေး · R မျိုးစေ့ပြောင်း · အိမ်တံခါးဆီ လျှောက်ရင် အိမ်ထဲဝင်မယ်</div>
  <div id="modal" hidden><div class="card" id="mcard"></div></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const T=16,DAYS=30,TICK=300,SLEN=10;
let MW=30,MH=24,VW=15,VH=11;
const G=0,SOIL=1,WEED=2,ROCK=3,TREE=4,WATER=5,PATH=6,FENCE=7,HOUSE=8,BIN=9,TROUGH=10,STALL=11,FLOWER=12,BLD=13,SAND=14,BRIDGE=15,JETTY=16,RAIL=17,PLAT=18,ROAD=19,CLIFF=20,FALL=21,CAVE=22,LOG=23,SIGN=24,STAIR=25,CFLOOR=26,CWALL=27,RUBBLE=28,CBOULD=29,MURAL=30,ALTAR=31,CRYST=32;
const SOLID=new Set([ROCK,TREE,WATER,FENCE,HOUSE,BIN,TROUGH,STALL,BLD,CLIFF,FALL,CAVE,LOG,SIGN,CWALL,RUBBLE,CBOULD,MURAL,ALTAR,CRYST]);
const SEASONS=[
  {name:'နွေ',rain:.08,grass:'#86a843',gs:['#7c9e3a','#6e8f33','#9cbc55','#b2c866'],path:'#dcb87f',flowers:['#f6c829','#f08a3a','#e2402f','#ffffff']},
  {name:'မိုး',rain:.55,grass:'#4f9e3c',gs:['#47933a','#3d8530','#5fb04a','#74c45a'],path:'#c09a66',flowers:['#ffffff','#b9a3ff','#7fb8ff','#f7a1c4']},
  {name:'ဆောင်း',rain:.05,grass:'#7fa556',gs:['#77994f','#6a8a45','#90b468','#a8c47a'],path:'#d3ae79',flowers:['#f4d35e','#f7a1c4','#ffffff','#e85a8a']},
];
const seasonOf=d=>Math.min(2,Math.floor((d-1)/SLEN));
const curS=()=>seasonOf(S.day);
const CROPS={
  kangkong:{name:'ကန်စွန်း',s:0,grow:3,regrow:0,sell:45,bag:120,col:'#4fb848',col2:'#9fe07a'},
  tomato:{name:'ခရမ်းချဉ်သီး',s:0,grow:6,regrow:3,sell:60,bag:300,col:'#e2402f',col2:'#ff8a6c'},
  melon:{name:'ဖရဲသီး',s:0,grow:8,regrow:0,sell:180,bag:600,col:'#2f7a2f',col2:'#e2504a'},
  okra:{name:'ရုံးပတီ',s:1,grow:4,regrow:2,sell:35,bag:260,col:'#7cc04a',col2:'#f2d35e'},
  corn:{name:'ပြောင်းဖူး',s:1,grow:7,regrow:3,sell:90,bag:400,col:'#f2cf3a',col2:'#fbe68a'},
  rice:{name:'စပါး',s:1,grow:8,regrow:0,sell:150,bag:500,col:'#e0b84a',col2:'#f6dc8a'},
  turnip:{name:'မုန်လာဥ',s:2,grow:4,regrow:0,sell:55,bag:130,col:'#f4eef6',col2:'#a35bb5'},
  potato:{name:'အာလူး',s:2,grow:6,regrow:0,sell:90,bag:220,col:'#c49a5a',col2:'#f6f1d0'},
  cabbage:{name:'ဂေါ်ဖီထုပ်',s:2,grow:8,regrow:0,sell:170,bag:550,col:'#b8e09a',col2:'#7cc46a'},
};
const CROP_IDS=Object.keys(CROPS);
const seasonCrops=s=>CROP_IDS.filter(id=>CROPS[id].s===s);
const EXTRA={ancoin:{name:'ရှေးဒင်္ဂါး',sell:0},egg:{name:'ကြက်ဥ',sell:50},fish:{name:'ငါး',sell:120},catfish:{name:'ငါးခူ',sell:80},carp:{name:'ငါးကြင်း',sell:120},snakehead:{name:'ငါးရံ',sell:160},prawn:{name:'ပုစွန်ထုပ်',sell:220},wood:{name:'ထင်း',sell:40},mushroom:{name:'မှို',sell:60},shoot:{name:'မျှစ်',sell:50},berry:{name:'ဆီးသီး',sell:45}};
const TOOLS=[{id:'hoe',name:'ပေါက်ပြား'},{id:'can',name:'ရေပုံး'},{id:'sickle',name:'တံစဉ်'},{id:'hammer',name:'တူ'},{id:'seed',name:'မျိုးစေ့'},{id:'tea',name:'လက်ဖက်ရည်'},{id:'rod',name:'ငါးမျှားတံ'},{id:'kite',name:'စွန်'},{id:'axe',name:'ပုဆိန်'}];
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const YARD={x0:22,x1:27,y0:11,y1:15};
const FIELD={x0:4,x1:18,y0:9,y1:19};
const DOOR=[5,5],GATE=[29,20];
const KEY='shwepan-farm-v6';
const HMAP=["##########","#S#w##w#K#","#.....BB.#","#.....BB.#","#.tt.....#","#.tt...C.#","#........#","####D#####"];
const HSOLID=new Set(['#','S','w','K','B','t','C']);
const hTile=(x,y)=>(y<0||y>=HMAP.length||x<0||x>=10)?'#':HMAP[y][x];

let S=null;
let mv=null, held=[], paused=true, acc=0, last=0, anim=null, parts=[], chickRT=[], npcRT=[], fade=0;

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return (h^(h>>16))>>>0};
const fmt=n=>n.toLocaleString('en-US');
const inField=(x,y)=>x>=FIELD.x0&&x<=FIELD.x1&&y>=FIELD.y0&&y<=FIELD.y1;
const tileAt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?TREE:S.tiles[y][x];
const inShop=n=>n.act==='work'&&n.wait&&!n.path.length&&n.t>=1&&!!SHOP_THEME[NPCS[npcRT.indexOf(n)].shop];
const npcAt=(x,y)=>npcRT.find(n=>n.active&&n.map===S.map&&!inShop(n)&&((n.x===x&&n.y===y)||(n.t<1&&n.fx===x&&n.fy===y)));
const walkable=(x,y)=>!SOLID.has(tileAt(x,y));
const front=()=>{const d=DIRS[S.dir];return[S.px+d[0],S.py+d[1]]};

function resetNPCs(){npcRT=NPCS.map(d=>{const h=HOMES[d.home];return{active:false,done:false,map:h[0],x:h[1],y:h[2],fx:h[1],fy:h[2],t:1,path:[],leg:0,wait:0,leaving:false,dir:'down',steps:0,act:null,via:null}})}
function bfs(m,sx,sy,tx,ty){
  const M=S.maps[m],BW=M.w,BH=M.h,ok=(x,y)=>{const t=tileAtM(m,x,y);return t===PATH||t===ROAD||t===G||t===FLOWER||t===SAND||t===BRIDGE||t===JETTY||t===STAIR},key=(x,y)=>y*BW+x,prev=new Map(),q=[[sx,sy]];prev.set(key(sx,sy),-1);
  let qi=0;
  while(qi<q.length){const [x,y]=q[qi++];
    if(x===tx&&y===ty){const p=[];let k=key(x,y);while(k!==key(sx,sy)){p.unshift([k%BW,(k/BW)|0]);k=prev.get(k)}return p}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx<0||ny<0||nx>=BW||ny>=BH||prev.has(k)||!ok(nx,ny))continue;prev.set(k,key(x,y));q.push([nx,ny])}}
  return [];
}
const dirOf=(dx,dy)=>dx>0?'right':dx<0?'left':dy>0?'down':'up';
function npcGoal(n,tg){
  if(tg[0]===n.map){n.via=null;n.path=bfs(n.map,n.x,n.y,tg[1],tg[2]);return}
  const e=EXITS[n.map].find(e=>e[3]===tg[0])||EXITS[n.map][0];n.via=e;n.final=tg;n.path=bfs(n.map,n.x,n.y,e[0],e[1]);
}
function updateNPCs(dt){
  const here=S.scene==='farm';
  NPCS.forEach((d,i)=>{const n=npcRT[i];if(!n||n.done)return;const home=HOMES[d.home],late=d.late||1080;
    if(!n.active){
      if(S.min>=d.plan[0][0]&&S.min<Math.min(1020,late-60)&&!(d.rainSkip&&S.weather==='rain')){
        Object.assign(n,{active:true,map:home[0],x:home[1],y:home[2],fx:home[1],fy:home[2],t:1,leg:0,wait:0,leaving:false,act:null,via:null});npcGoal(n,d.plan[0][1])}
      return;
    }
    if(n.t<1){n.t=Math.min(1,n.t+dt/230);return}
    if(n.path.length){const [nx,ny]=n.path[0];
      n.path.shift();n.fx=n.x;n.fy=n.y;n.dir=dirOf(nx-n.x,ny-n.y);n.x=nx;n.y=ny;n.t=0;n.steps++;return}
    if(n.via){const e=n.via;n.map=e[3];n.x=n.fx=e[4];n.y=n.fy=e[5];n.via=null;npcGoal(n,n.final);return}
    if(n.leaving){n.active=false;n.done=true;return}
    const leg=d.plan[n.leg];
    if(!n.wait){n.wait=S.min+leg[2];n.dir=leg[3];n.act=leg[4]||null}
    if(S.min>=n.wait||S.min>=late){n.wait=0;n.act=null;n.leg++;
      if(n.leg<d.plan.length&&S.min<late)npcGoal(n,d.plan[n.leg][1]);
      else{n.leaving=true;npcGoal(n,home)}}
  });
}

function ship(){
  let n=0,v=0;const keep=S.q.q_bridge==='active'?Math.min(10,S.produce.wood):0;S.produce.wood-=keep;
  CROP_IDS.forEach(id=>{n+=S.produce[id];v+=S.produce[id]*CROPS[id].sell;S.produce[id]=0});
  for(const id in EXTRA){if(id==='ancoin')continue;n+=S.produce[id];v+=S.produce[id]*EXTRA[id].sell;S.produce[id]=0}
  S.produce.wood+=keep;

  S.shippedValue+=v;S.shippedCount+=n;S.stats.shipped=(S.stats.shipped||0)+n;
  toast(`${n} ခု ပို့လိုက်ပြီ (+${fmt(v)} ကျပ်)။ မနက်ဖြန် ငွေရမယ်${keep?` · တံတားအတွက် ထင်း ${keep} စည်း ချန်ထားတယ်`:''}`);
}
function feedChickens(){
  const need=S.chickens.length-S.trough;
  if(!S.chickens.length)return toast('ကြက် မရှိသေးဘူး။ ဈေးဆိုင်မှာ ဝယ်လို့ရတယ်');
  if(need<=0)return toast('ကြက်စာ ပြည့်နေပြီ');
  if(S.feed<=0)return toast('ကြက်စာ မရှိဘူး။ ဈေးဆိုင်မှာ ဝယ်ပါ');
  const put=Math.min(need,S.feed);S.feed-=put;S.trough+=put;
  toast(`ကြက်စာ ${put} ခွက် ထည့်လိုက်တယ် (${S.trough}/${S.chickens.length})`);
}

/* ---------- day cycle ---------- */
function endDay(passedOut){
  if(S.map!=='farm')setMap('farm');
  const income=S.shippedValue,count=S.shippedCount,oldS=curS();
  S.money+=income;S.stats.earned+=income;S.shippedValue=0;S.shippedCount=0;
  for(const k in S.crops){const [x,y]=k.split(',').map(Number);if(S.wet[y][x]&&!S.crops[k].dead)S.crops[k].age++}
  for(let y=0;y<MH;y++)S.wet[y].fill(0);
  const fed=Math.min(S.trough,S.chickens.length);S.trough=0;let laid=0;
  for(let i=0;i<fed&&S.eggs.length<14;i++){
    for(let tries=0;tries<20;tries++){
      const x=YARD.x0+Math.floor(Math.random()*(YARD.x1-YARD.x0+1)),y=YARD.y0+Math.floor(Math.random()*(YARD.y1-YARD.y0+1));
      if(S.tiles[y][x]===G&&!S.eggs.some(e=>e.x===x&&e.y===y)){S.eggs.push({x,y});laid++;break}
    }
  }
  for(let i=0;i<5;i++){const x=FIELD.x0+Math.floor(Math.random()*15),y=FIELD.y0+Math.floor(Math.random()*11);if(S.tiles[y][x]===G)S.tiles[y][x]=WEED}
  if(fed&&!S.eggs.some(e=>e.k==='coin')&&Math.random()<Math.min(.5,.12*fed)){for(let tries=0;tries<20;tries++){const x=YARD.x0+Math.floor(Math.random()*3),y=YARD.y1-Math.floor(Math.random()*2);if(S.tiles[y][x]===G&&!S.eggs.some(e=>e.x===x&&e.y===y)){S.eggs.push({x,y,k:'coin'});break}}}
  S.sus=Math.max(0,S.sus-8);S.rival=Math.min(100,S.rival+2+(S.sus>=50?3:0));
  if(S.day>=DAYS)return finalEnding(S.rival>=100&&!S.flags.map2?'lost':'none');
  S.day++;
  const ns=curS();let withered=0;
  if(ns!==oldS){for(const k in S.crops){const c=S.crops[k];if(CROPS[c.type].s!==ns&&!c.dead){c.dead=true;withered++}}S.seedSel=seasonCrops(ns)[0]}
  S.weather=S.tomorrow;S.tomorrow=Math.random()<SEASONS[seasonOf(Math.min(DAYS,S.day+1))].rain?'rain':'sun';
  if(S.day===14)S.tomorrow='rain';if(S.day===15)S.weather='rain';
  if(S.flags.flood&&S.day>S.flags.flood)setFlood(false);
  if(S.weather==='rain')for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(S.tiles[y][x]===SOIL)S.wet[y][x]=1;
  S.min=360;S.energy=passedOut?60:S.maxE;S.scene='house';S.px=5;S.py=3;S.dir='down';mv=null;
  S.talked={};S.daily={};fishRT=null;kiteRT=null;
  if(S.day===7)qStart('q_thingyan',true);if(S.day>8&&S.q.q_thingyan==='active')S.q.q_thingyan='missed';
  syncChickens();resetNPCs();spawnForest();dirty=true;save();
  morning(income,count,laid,passedOut,ns!==oldS,withered);
}

function openShop(id){
  const sp=SHOPS[id];
  if(S.min<sp.open||S.min>=sp.close){const f=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;return toast(`${sp.name} ပိတ်ထားတယ်။ ဖွင့်ချိန် ${f(sp.open)} – ${f(sp.close)}`)}
  let items=sp.items();
  const render=()=>`${id==='stall'?`<div class="tk"><img class="pt" src="${PT_SRC.khin}" alt="ဒေါ်ခင်" style="object-fit:cover"><div><h2>${sp.name}</h2><p class="sub">${sp.sub()} · ငွေ ${fmt(S.money)} ကျပ် ရှိတယ်</p></div></div>`:`<h2>${sp.name}</h2><p class="sub">${sp.sub()} · ငွေ ${fmt(S.money)} ကျပ် ရှိတယ်</p>`}
    ${items.map(it=>`<div class="item"><b>${it.label}</b><span class="sub">${it.desc}</span><button class="bt" type="button" data-buy="${it.id}" ${(!it.ok()||S.money<it.price)?'disabled':''}>${it.ok()?fmt(it.price)+' ကျပ်':'ရှိပြီ'}</button></div>`).join('')}
    <div class="btns"><button class="bt pri" type="button" id="mC">ပြန်မယ်</button></div>`;
  const bind=c=>{
    c.querySelector('#mC').onclick=close;
    c.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
      const it=items.find(i=>i.id===b.dataset.buy);if(!it.ok()||S.money<it.price)return;
      S.money-=it.price;it.buy();items=sp.items();
      c.innerHTML=render();bind(c);hud();belt();
      const again=c.querySelector(`[data-buy="${it.id}"]`);(again&&!again.disabled?again:c.querySelector('#mC')).focus();
    });
  };
  show(render(),bind);
}

/* ---------- fishing & kite ---------- */
let fishRT=null,kiteRT=null;
const inMeadow=(x,y)=>S.map==='forest'&&x>=2&&x<=18&&y>=14&&y<=28;
function catchFish(){
  const r=Math.random();let id;
  if(!fishRT.river)id=r<.6?'catfish':'carp';
  else{const pr=curS()===1?.3:.15;id=r<pr?'prawn':r<pr+.4?'snakehead':'carp'}
  S.produce[id]++;S.stats.fish=(S.stats.fish||0)+1;burst(fishRT.x,fishRT.y,'#bfe6fa',10);
  toast(`${EXTRA[id].name} ရပြီ! (${EXTRA[id].sell} ကျပ်) · ပို့ကုန်ပုံးမှာ ရောင်းပါ`);fishRT=null;return id;
}
function updateFun(dt,ticked){
  if(fishRT){
    if(held.length){fishRT=null;toast('ငါးမျှားတာ ရပ်လိုက်တယ်')}
    else{fishRT.t-=dt;if(fishRT.t<=0){if(fishRT.phase==='wait'){fishRT.phase='bite';fishRT.t=800}else{toast('ငါးလွတ်သွားတယ်။ ထပ်ကြိုးစားပါ');fishRT=null}}}
  }
  if(kiteRT){
    if(S.scene!=='farm'||S.weather==='rain'||!inMeadow(S.px,S.py)){kiteRT=null;toast('စွန်ကို ပြန်ရစ်လိုက်တယ်')}
    else{kiteRT.h=Math.min(1,kiteRT.h+dt/2500);
      if(ticked&&kiteRT.h>=1&&++kiteRT.min===20&&!S.daily.kite){S.daily.kite=1;S.energy=Math.min(S.maxE,S.energy+20);toast('စွန် မြင့်မြင့် ပျံနေတယ်။ စိတ်ကြည်လင်သွားတယ် (အားအင် +20)')}}
  }
}

  parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=200*dt/1000});
  updateAct(dt);

  updateDlg(dt);updateActors(dt);
  if(paused||!S||CUT)return;

    const sp=.9*dt/1000;c.x+=dx/dist*Math.min(sp,dist);c.y+=dy/dist*Math.min(sp,dist);if(Math.abs(dx)>.01)c.face=dx>0?1:-1;
  });
